<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Art Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --color-bg-main: #FFFFFF;
            --color-bg-alt: #FCFCFC;
            --color-text-main: #121212;
            --color-text-muted: #575757;
            --color-text-faint: #9C9C9C;
            --color-border: #DEDEDE;
            --color-accent: #9B4B4B;
            --color-card-backdrop: rgba(255, 255, 255, 0.95);
            --effect-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --anim-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --color-filter-bg: #FFFFFF;
        }

        body.mode-dark {
            --color-bg-main: #1A1A1A;
            --color-bg-alt: #252525;
            --color-text-main: #F0F0F0;
            --color-text-muted: #CCCCCC;
            --color-text-faint: #AAAAAA;
            --color-border: #3A3A3A;
            --color-accent: #C97C7C;
            --color-card-backdrop: rgba(26, 26, 26, 0.95);
            --effect-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            --color-filter-bg: #252525;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--color-bg-main);
            color: var(--color-text-main);
            transition: var(--anim-transition);
            overflow-x: hidden;
        }

        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background-color: var(--color-bg-main);
            border-bottom: 1px solid var(--color-border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 40px;
        }

        .mode-switch {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--anim-transition);
        }

        .mode-switch:hover {
            transform: scale(1.05);
        }

        .mode-switch svg {
            width: 22px;
            height: 22px;
            stroke: var(--color-text-main);
            fill: none;
        }

        .main-wrapper {
            max-width: 1280px;
            margin: 0 auto;
            padding: 120px 40px 60px;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-bottom: 48px;
        }

        .query-field {
            position: relative;
            width: 320px;
        }

        .query-field input {
            width: 100%;
            height: 44px;
            padding: 0 40px 0 44px;
            background-color: var(--color-bg-main);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 300;
            color: var(--color-text-main);
            transition: var(--anim-transition);
            font-family: 'Inter', sans-serif;
        }

        .query-field input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .query-field input::placeholder {
            color: var(--color-text-faint);
            font-weight: 300;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--color-text-faint);
            stroke-width: 1.5;
            fill: none;
            pointer-events: none;
        }

        .filter-trigger {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background-color: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--anim-transition);
            position: relative;
            z-index: 1001;
        }

        .filter-trigger:hover {
            border-color: var(--color-accent);
            transform: scale(1.02);
        }

        .filter-trigger svg {
            width: 20px;
            height: 20px;
            stroke: var(--color-accent);
            stroke-width: 1.5;
            fill: none;
        }

        .filter-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background-color: var(--color-filter-bg);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
            z-index: 2000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .filter-drawer.active {
            right: 0;
        }

        .drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 24px;
            border-bottom: 1px solid var(--color-border);
        }

        .drawer-head h2 {
            font-size: 20px;
            font-weight: 500;
            color: var(--color-text-main);
        }

        .drawer-close {
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--anim-transition);
        }

        .drawer-close:hover {
            background-color: var(--color-bg-alt);
        }

        .drawer-close svg {
            width: 18px;
            height: 18px;
            stroke: var(--color-text-muted);
            stroke-width: 1.8;
        }

        .drawer-body {
            flex: 1;
            padding: 16px 0;
        }

        .filter-group {
            border-bottom: 1px solid var(--color-border);
        }

        .filter-group-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .filter-group-head:hover {
            background-color: var(--color-bg-alt);
        }

        .filter-group-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--color-text-main);
        }

        .expand-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .expand-icon svg {
            width: 16px;
            height: 16px;
            stroke: var(--color-accent);
            stroke-width: 2;
            fill: none;
        }

        .filter-group-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding: 0 24px;
        }

        .filter-group-body.expanded {
            max-height: 400px;
            padding: 0 24px 20px 24px;
        }

        .select-box {
            position: relative;
            margin-bottom: 16px;
        }

        .select-box input {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--color-bg-main);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--color-text-main);
            font-family: 'Inter', sans-serif;
        }

        .select-box input:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .options-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--color-bg-main);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            margin-top: 4px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 10000;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .options-list.visible {
            display: block;
        }

        .option-entry {
            padding: 10px 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
            color: var(--color-text-muted);
        }

        .option-entry:hover {
            background-color: var(--color-bg-alt);
            color: var(--color-accent);
        }

        .active-selections {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .selection-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background-color: var(--color-accent);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .selection-chip button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            padding: 0;
        }

        .year-selector {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .year-field {
            flex: 1;
        }

        .year-field label {
            display: block;
            font-size: 12px;
            color: var(--color-text-faint);
            margin-bottom: 6px;
        }

        .year-field input {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--color-bg-main);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            font-size: 14px;
            color: var(--color-text-main);
        }

        .drawer-foot {
            padding: 20px 24px;
            border-top: 1px solid var(--color-border);
            display: flex;
            gap: 24px;
            justify-content: space-between;
        }

        .btn-apply, .btn-reset {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 8px 0;
            font-family: 'Inter', sans-serif;
        }

        .btn-apply {
            color: var(--color-accent);
        }

        .btn-reset {
            color: var(--color-text-muted);
        }

        .btn-apply:hover, .btn-reset:hover {
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }

        .drawer-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1999;
        }

        .drawer-backdrop.visible {
            opacity: 1;
            visibility: visible;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            margin-bottom: 60px;
        }

        .piece-card {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--effect-shadow);
            background-color: #8B7355;
        }

        .piece-visual {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .piece-card:hover .piece-visual {
            transform: scale(1.1);
        }

        .card-info-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 75%;
            display: flex;
            align-items: stretch;
        }

        .card-mask {
            flex: 1;
            background: var(--color-card-backdrop);
            padding: 20px 16px 24px 20px;
            z-index: 2;
            overflow: hidden;
        }

        .info-content {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .meta-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            position: relative;
        }

        .divider-line {
            width: 2px;
            background-color: var(--color-accent);
            flex-shrink: 0;
            transition: opacity 0.3s ease, width 0.3s ease;
            align-self: stretch;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .text-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .text-stack {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .piece-name {
            font-family: 'Cormorant SC', 'Times New Roman', serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--color-text-main);
            text-transform: uppercase;
            line-height: 1.3;
            display: block;
            flex: 1;
        }

        .piece-year {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--color-accent);
            letter-spacing: 0.3px;
            display: block;
            white-space: nowrap;
        }

        .alt-name {
            display: block;
            font-family: 'Cormorant SC', 'Times New Roman', serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--color-text-main);
            text-transform: uppercase;
            line-height: 1.3;
        }

        .alt-year {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--color-accent);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .default-view,
        .alt-view {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .alt-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transform: translateX(-100%);
            opacity: 0;
        }

        .piece-card:hover .default-view {
            transform: translateY(100%);
            opacity: 0;
        }

        .piece-card:hover .alt-view {
            transform: translateX(0);
            opacity: 1;
        }

        .default-view {
            transform: translateY(0);
            opacity: 1;
        }

        .nav-indicator {
            width: 60px;
            background: var(--color-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            transform: translateX(-100%);
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            visibility: hidden;
        }

        @media (min-width: 769px) {
            .piece-card:hover .nav-indicator {
                transform: translateX(-100%);
                opacity: 0;
                visibility: hidden;
            }
        }

        @media (max-width: 768px) {
            .piece-card.touched .nav-indicator {
                transform: translateX(0);
                opacity: 1;
                visibility: visible;
            }
        }

        .piece-card:hover .divider-line {
            opacity: 0;
            width: 0;
        }

        @media (max-width: 1024px) {
            .card-mask {
                padding: 16px 12px 20px 16px;
            }
            .nav-indicator {
                width: 50px;
            }
            .nav-indicator svg {
                width: 20px;
                height: 20px;
            }
            .piece-name {
                font-size: 14px;
            }
            .alt-name {
                font-size: 14px;
            }
        }

        @media (max-width: 768px) {
            .main-wrapper {
                padding: 90px 16px 40px;
            }
            .collection-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            .filter-drawer {
                width: 100%;
                right: -100%;
            }
            .card-info-panel {
                width: 80%;
            }
            .nav-indicator {
                width: 45px;
            }
            .piece-name {
                font-size: 12px;
            }
            .piece-year {
                font-size: 11px;
            }
            .alt-name {
                font-size: 12px;
            }
            .alt-year {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .collection-grid {
                grid-template-columns: 1fr;
            }
            .card-info-panel {
                width: 85%;
            }
            .nav-indicator {
                width: 40px;
            }
        }

        .page-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .pager-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pager-item {
            min-width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--color-text-muted);
            background: transparent;
            border: none;
        }

        .pager-item.current {
            background-color: rgba(18, 18, 18, 0.08);
            font-weight: 500;
            color: var(--color-text-main);
        }

        .pager-nav {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 6px;
        }

        .pager-nav svg {
            width: 18px;
            height: 18px;
            stroke: var(--color-text-muted);
            stroke-width: 1.8;
            fill: none;
        }

        .inactive {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;
            color: var(--color-text-faint);
            grid-column: 1 / -1;
        }

        .snackbar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--color-text-main);
            color: var(--color-bg-main);
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 2000;
            transition: transform 0.3s ease;
            white-space: nowrap;
            pointer-events: none;
        }

        .snackbar.active {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="mode-switch" id="modeSwitcher">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </div>
    </header>

    <main class="main-wrapper">
        <div class="toolbar">
            <div class="query-field">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="searchField" placeholder="Painting title">
            </div>
            <button class="filter-trigger" id="filterToggle">
                <svg viewBox="0 0 24 24">
                    <polygon points="22 3 2 3 10 13 10 21 14 18 14 13 22 3"/>
                </svg>
            </button>
        </div>

        <div class="collection-grid" id="artworkGrid"></div>
        <div class="page-controls" id="pagerContainer"></div>
    </main>

    <div class="drawer-backdrop" id="modalOverlay"></div>

    <div class="filter-drawer" id="filterDrawer">
        <div class="drawer-head">
            <h2>Filters</h2>
            <div class="drawer-close" id="dismissFilter">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </div>
        </div>

        <div class="drawer-body">
            <div class="filter-group">
                <div class="filter-group-head" data-section="artist">
                    <span class="filter-group-title">Artist</span>
                    <div class="expand-icon" id="expandArtist">
                        <svg viewBox="0 0 24 24">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </div>
                </div>
                <div class="filter-group-body" id="artistSection">
                    <div class="select-box" id="artistSelectBox">
                        <input type="text" placeholder="Search artist..." id="artistQuery">
                        <div class="options-list" id="artistList"></div>
                    </div>
                    <div class="active-selections" id="chosenArtists"></div>
                </div>
            </div>

            <div class="filter-group">
                <div class="filter-group-head" data-section="location">
                    <span class="filter-group-title">Location</span>
                    <div class="expand-icon" id="expandLocation">
                        <svg viewBox="0 0 24 24">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </div>
                </div>
                <div class="filter-group-body" id="locationSection">
                    <div class="select-box" id="locationSelectBox">
                        <input type="text" placeholder="Search location..." id="locationQuery">
                        <div class="options-list" id="locationList"></div>
                    </div>
                    <div class="active-selections" id="chosenLocations"></div>
                </div>
            </div>

            <div class="filter-group">
                <div class="filter-group-head" data-section="years">
                    <span class="filter-group-title">Years</span>
                    <div class="expand-icon" id="expandYears">
                        <svg viewBox="0 0 24 24">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </div>
                </div>
                <div class="filter-group-body" id="yearsSection">
                    <div class="year-selector">
                        <div class="year-field">
                            <label>From</label>
                            <input type="number" id="startYear" placeholder="1400" value="1400">
                        </div>
                        <div class="year-separator">—</div>
                        <div class="year-field">
                            <label>To</label>
                            <input type="number" id="endYear" placeholder="2024" value="2024">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="drawer-foot">
            <button class="btn-apply" id="confirmFilters">Show the results</button>
            <button class="btn-reset" id="clearFilters">Clear</button>
        </div>
    </div>

    <div class="snackbar" id="notification">Message</div>

    <script>
        const collectionData = [
            { title: "CASCATE DI TIVOLI", date: 1761, artist: "Giovanni Battista", location: "Italy", image: "https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?w=600&h=600&fit=crop" },
            { title: "PORTRAIT OF VINCENT VAN GOGH", date: 1886, artist: "Vincent van Gogh", location: "Netherlands", image: "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=600&h=600&fit=crop" },
            { title: "UNEQUAL MARRIAGE", date: 1862, artist: "Vasili Pukirev", location: "Russia", image: "https://images.unsplash.com/photo-1544967082-d9d25d867d66?w=600&h=600&fit=crop" },
            { title: "THE HAPPY VIOLINIST", date: 1624, artist: "Gerrit van Honthorst", location: "Netherlands", image: "https://images.unsplash.com/photo-1515405295579-ba7b45403062?w=600&h=600&fit=crop" },
            { title: "THE ARCADIAN", date: 1834, artist: "Thomas Cole", location: "USA", image: "https://images.unsplash.com/photo-1552053831-71594a27632d?w=600&h=600&fit=crop" },
            { title: "GOLFO DI NAPOLI", date: 1845, artist: "Ivan Aivazovsky", location: "Russia", image: "https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=600&h=600&fit=crop" },
            { title: "THE LAST SUPPER", date: 1498, artist: "Leonardo da Vinci", location: "Italy", image: "https://images.unsplash.com/photo-1574364629869-9e4281ddaad9?w=600&h=600&fit=crop" },
            { title: "STARRY NIGHT", date: 1889, artist: "Vincent van Gogh", location: "Netherlands", image: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=600&h=600&fit=crop" },
            { title: "MONA LISA", date: 1503, artist: "Leonardo da Vinci", location: "Italy", image: "https://images.unsplash.com/photo-1548821806-45e08c03e651?w=600&h=600&fit=crop" }
        ];

        const uniqueArtists = [...new Set(collectionData.map(a => a.artist))];
        const uniqueLocations = [...new Set(collectionData.map(a => a.location))];

        let activePage = 1;
        let visibleItems = [...collectionData];
        let pageSize = 6;
        
        let activeFilters = {
            artists: [],
            locations: [],
            yearFrom: 1400,
            yearTo: 2024
        };

        const gridContainer = document.getElementById('artworkGrid');
        const pagerContainer = document.getElementById('pagerContainer');
        const searchField = document.getElementById('searchField');
        const filterToggle = document.getElementById('filterToggle');
        const filterDrawer = document.getElementById('filterDrawer');
        const modalOverlay = document.getElementById('modalOverlay');
        const dismissFilter = document.getElementById('dismissFilter');
        const modeSwitcher = document.getElementById('modeSwitcher');
        const notification = document.getElementById('notification');

        function detectTouch() {
            return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        }

        function setupTouchHandlers() {
            if (detectTouch()) {
                const cards = document.querySelectorAll('.piece-card');
                cards.forEach(card => {
                    card.addEventListener('click', function(e) {
                        cards.forEach(c => c.classList.remove('touched'));
                        this.classList.add('touched');
                        e.stopPropagation();
                    });
                });
                
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.piece-card')) {
                        cards.forEach(card => card.classList.remove('touched'));
                    }
                });
            }
        }

        function loadTheme() {
            if (localStorage.getItem('art-theme') === 'dark') {
                document.body.classList.add('mode-dark');
                refreshModeIcon(true);
            }
        }

        function refreshModeIcon(isDark) {
            const svg = modeSwitcher.querySelector('svg');
            if (isDark) {
                svg.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
            } else {
                svg.innerHTML = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
            }
        }

        modeSwitcher.addEventListener('click', () => {
            document.body.classList.toggle('mode-dark');
            localStorage.setItem('art-theme', document.body.classList.contains('mode-dark') ? 'dark' : 'light');
            refreshModeIcon(document.body.classList.contains('mode-dark'));
            showNotification(document.body.classList.contains('mode-dark') ? 'Dark mode enabled' : 'Light mode enabled');
        });

        function showNotification(msg) {
            notification.textContent = msg;
            notification.classList.add('active');
            setTimeout(() => notification.classList.remove('active'), 2000);
        }

        function revealDrawer() {
            filterDrawer.classList.add('active');
            modalOverlay.classList.add('visible');
        }

        function hideDrawer() {
            filterDrawer.classList.remove('active');
            modalOverlay.classList.remove('visible');
        }

        filterToggle.addEventListener('click', revealDrawer);
        dismissFilter.addEventListener('click', hideDrawer);
        modalOverlay.addEventListener('click', hideDrawer);

        function toggleGroup(sectionId, triggerId) {
            const section = document.getElementById(sectionId);
            const trigger = document.getElementById(triggerId);
            const isOpen = section.classList.contains('expanded');
            
            if (isOpen) {
                section.classList.remove('expanded');
                trigger.innerHTML = `<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
            } else {
                section.classList.add('expanded');
                trigger.innerHTML = `<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
            }
        }

        document.getElementById('expandArtist').addEventListener('click', () => toggleGroup('artistSection', 'expandArtist'));
        document.getElementById('expandLocation').addEventListener('click', () => toggleGroup('locationSection', 'expandLocation'));
        document.getElementById('expandYears').addEventListener('click', () => toggleGroup('yearsSection', 'expandYears'));

        function initSelectBox(inputId, listId, allValues, selectedList, containerId) {
            const inputEl = document.getElementById(inputId);
            const listEl = document.getElementById(listId);
            const containerEl = document.getElementById(containerId);
            
            function populateList(filterText = '') {
                const filtered = allValues.filter(val => 
                    val.toLowerCase().includes(filterText.toLowerCase())
                );
                listEl.innerHTML = filtered.map(val => `
                    <div class="option-entry" data-value="${val}">${val}</div>
                `).join('');
                
                listEl.querySelectorAll('.option-entry').forEach(entry => {
                    entry.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const value = entry.dataset.value;
                        if (!selectedList.includes(value)) {
                            selectedList.push(value);
                            updateChips();
                        }
                        inputEl.value = '';
                        listEl.classList.remove('visible');
                    });
                });
            }
            
            function updateChips() {
                containerEl.innerHTML = selectedList.map(val => `
                    <div class="selection-chip">
                        ${val}
                        <button data-value="${val}">×</button>
                    </div>
                `).join('');
                
                containerEl.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const value = btn.dataset.value;
                        const idx = selectedList.indexOf(value);
                        if (idx > -1) selectedList.splice(idx, 1);
                        updateChips();
                    });
                });
            }
            
            inputEl.addEventListener('click', (e) => {
                e.stopPropagation();
                populateList(inputEl.value);
                listEl.classList.add('visible');
            });
            
            inputEl.addEventListener('input', () => {
                populateList(inputEl.value);
                listEl.classList.add('visible');
            });
            
            document.addEventListener('click', (e) => {
                if (!inputEl.contains(e.target) && !listEl.contains(e.target)) {
                    listEl.classList.remove('visible');
                }
            });
            
            updateChips();
        }

        initSelectBox('artistQuery', 'artistList', uniqueArtists, activeFilters.artists, 'chosenArtists');
        initSelectBox('locationQuery', 'locationList', uniqueLocations, activeFilters.locations, 'chosenLocations');

        function executeFilters() {
            const fromYear = parseInt(document.getElementById('startYear').value) || 1400;
            const toYear = parseInt(document.getElementById('endYear').value) || 2024;
            
            activeFilters.yearFrom = fromYear;
            activeFilters.yearTo = toYear;
            
            visibleItems = collectionData.filter(item => {
                if (activeFilters.artists.length > 0 && !activeFilters.artists.includes(item.artist)) return false;
                if (activeFilters.locations.length > 0 && !activeFilters.locations.includes(item.location)) return false;
                if (item.date < activeFilters.yearFrom || item.date > activeFilters.yearTo) return false;
                return true;
            });
            
            activePage = 1;
            drawGrid();
            drawPager();
            hideDrawer();
            showNotification(`Found ${visibleItems.length} artworks`);
        }

        function clearAllFilters() {
            activeFilters.artists = [];
            activeFilters.locations = [];
            activeFilters.yearFrom = 1400;
            activeFilters.yearTo = 2024;
            
            document.getElementById('startYear').value = 1400;
            document.getElementById('endYear').value = 2024;
            
            document.getElementById('chosenArtists').innerHTML = '';
            document.getElementById('chosenLocations').innerHTML = '';
            
            visibleItems = [...collectionData];
            activePage = 1;
            drawGrid();
            drawPager();
            showNotification('All filters cleared');
        }

        document.getElementById('confirmFilters').addEventListener('click', executeFilters);
        document.getElementById('clearFilters').addEventListener('click', clearAllFilters);

        function applySearch() {
            const term = searchField.value.toLowerCase().trim();
            visibleItems = term === '' ? [...collectionData] : collectionData.filter(item => item.title.toLowerCase().includes(term));
            activePage = 1;
            drawGrid();
            drawPager();
        }

        let searchTimer;
        searchField.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(applySearch, 300);
        });

        function adjustCardHeights() {
            const cards = document.querySelectorAll('.piece-card');
            cards.forEach((card) => {
                const titleEl = card.querySelector('.default-name');
                const yearEl = card.querySelector('.default-year');
                const textWrap = card.querySelector('.text-container');
                
                if (titleEl && yearEl && textWrap) {
                    const titleH = titleEl.offsetHeight;
                    const yearH = yearEl.offsetHeight;
                    const totalH = titleH + yearH + 8;
                    
                    textWrap.style.minHeight = totalH + 'px';
                    
                    const defView = card.querySelector('.default-view');
                    const altView = card.querySelector('.alt-view');
                    if (defView && altView) {
                        defView.style.minHeight = totalH + 'px';
                        altView.style.minHeight = totalH + 'px';
                    }
                }
            });
        }

        function drawGrid() {
            const startIdx = (activePage - 1) * pageSize;
            const pageItems = visibleItems.slice(startIdx, startIdx + pageSize);
            
            if (visibleItems.length === 0) {
                gridContainer.innerHTML = '<div class="empty-state">No paintings found</div>';
                return;
            }
            
            gridContainer.innerHTML = pageItems.map(item => `
                <div class="piece-card">
                    <div class="piece-visual" style="background-image: url('foto/2.png'); background-size: cover; background-position: center;"></div>
                    <div class="card-info-panel">
                        <div class="card-mask">
                            <div class="info-content">
                                <div class="meta-row">
                                    <div class="divider-line"></div>
                                    <div class="text-container">
                                        <div class="default-view" style="width: 100%;">
                                            <div class="text-stack">
                                                <span class="piece-name default-name">${item.title}</span>
                                                <span class="piece-year default-year">${item.date}</span>
                                            </div>
                                        </div>
                                        <div class="alt-view" style="width: 100%;">
                                            <div class="text-stack">
                                                <span class="alt-name">JEAN HONORE FRAGONARD</span>
                                                <span class="alt-year">LOUVRE MUSEUM</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="nav-indicator">
                            <svg viewBox="0 0 24 24">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </div>
                    </div>
                </div>
            `).join('');
            
            setTimeout(() => {
                adjustCardHeights();
            }, 10);
            
            setupTouchHandlers();
        }

        function drawPager() {
            const totalPages = Math.ceil(visibleItems.length / pageSize);
            if (totalPages <= 1) {
                pagerContainer.innerHTML = '';
                return;
            }
            
            let html = `
                <div class="pager-nav ${activePage === 1 ? 'inactive' : ''}" id="goPrev">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                </div>
                <div class="pager-buttons">`;
            
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                html += `<button class="pager-item ${activePage === i ? 'current' : ''}" data-pagenum="${i}">${i}</button>`;
            }
            if (totalPages > 5) html += `<span style="color: var(--color-text-faint);">...</span><button class="pager-item" data-pagenum="${totalPages}">${totalPages}</button>`;
            
            html += `</div><div class="pager-nav ${activePage === totalPages ? 'inactive' : ''}" id="goNext">
                        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                    </div>`;
            
            pagerContainer.innerHTML = html;
            
            document.querySelectorAll('.pager-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    activePage = parseInt(btn.dataset.pagenum);
                    drawGrid();
                    drawPager();
                    gridContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });
            
            document.getElementById('goPrev')?.addEventListener('click', () => {
                if (activePage > 1) {
                    activePage--;
                    drawGrid();
                    drawPager();
                    gridContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
            
            document.getElementById('goNext')?.addEventListener('click', () => {
                if (activePage < totalPages) {
                    activePage++;
                    drawGrid();
                    drawPager();
                    gridContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        }

        loadTheme();
        drawGrid();
        drawPager();

        const fontLink = document.createElement('link');
        fontLink.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Cormorant+SC:wght@500&display=swap';
        fontLink.rel = 'stylesheet';
        document.head.appendChild(fontLink);
        
        window.addEventListener('resize', () => {
            setTimeout(adjustCardHeights, 50);
        });
    </script>
</body>
</html>
